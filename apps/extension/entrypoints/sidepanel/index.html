<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annotated</title>
    <script>
      (function(){try{var k="annotated.appearance";var c="annotated-appearance";var valid={system:1,light:1,dark:1};function parse(v){return valid[v]?v:'system';}function cookie(){var parts=document.cookie?document.cookie.split(';'):[];for(var i=0;i<parts.length;i++){var p=parts[i].trim();if(p.indexOf(c+'=')===0){try{return decodeURIComponent(p.slice(c.length+1));}catch(e){return p.slice(c.length+1);}}}return '';}var stored='';try{stored=localStorage.getItem(k)||'';}catch(e){}var pref=parse(stored||cookie());var light=pref==='light'||(pref!=='dark'&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches);var theme=light?'light':'dark';var root=document.documentElement;root.setAttribute("data-theme",theme);root.setAttribute("data-appearance",pref);root.style.colorScheme=theme;}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
