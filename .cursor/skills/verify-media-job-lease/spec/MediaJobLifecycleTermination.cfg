\* Same model as MediaJobLifecycle.cfg, liveness only.
\* Mutual exclusion is checked in the safety config so a mutex
\* counterexample does not hide the termination result.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  Jobs = {j1, j2}
  Nil = nil
  MaxAttempts = 3
  CheckLease = TRUE
  IncrementAttempt = TRUE
  ExpireWhileRunning = FALSE
INVARIANTS
  TypeOK
  AttemptBound
PROPERTIES
  Termination
