\* Mutant config only. Claim does not increment attempt_count.
\* Product code is unchanged. ExpireWhileRunning is FALSE so the
\* counterexample is the retry loop, not the lease-overrun trace.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  Jobs = {j1, j2}
  Nil = nil
  MaxAttempts = 3
  CheckLease = TRUE
  IncrementAttempt = FALSE
  ExpireWhileRunning = FALSE
INVARIANTS
  TypeOK
  AttemptBound
PROPERTIES
  Termination
