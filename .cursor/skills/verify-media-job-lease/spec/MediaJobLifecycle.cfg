\* Real claim, release, wake, and reconciler.
\* Startup refuses a lease that can expire while the task is alive,
\* so expiry while a worker is still running is not a reachable setting.
\* Confirm and finalize also require an unexpired lease.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  Jobs = {j1, j2}
  Nil = nil
  MaxAttempts = 3
  CheckLease = TRUE
  IncrementAttempt = TRUE
  ExpireWhileRunning = FALSE
INVARIANTS
  TypeOK
  MutualExclusion
  AttemptBound
